name: PBH satellite anomaly scan

on:
  push:
    branches:
      - pbh-satellite-scan
    paths:
      - "research/pbh_satellite_scan/**"
      - ".github/workflows/pbh-satellite-scan.yml"
  workflow_dispatch:

jobs:
  lageos-zenodo-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r research/pbh_satellite_scan/requirements.txt

      - name: Generic Zenodo scan
        working-directory: research/pbh_satellite_scan
        run: |
          python scan_zenodo.py \
            --record 18441938 \
            --workdir work \
            --outdir output \
            --max-mb 250 \
            --top-per-column 30

      - name: Dedicated LAGEOS numeric scan
        working-directory: research/pbh_satellite_scan
        run: python scan_lageos.py --outdir output --top-per-column 40

      - name: Record exact Zenodo archive contents
        working-directory: research/pbh_satellite_scan
        run: python inspect_zenodo.py --record 18441938 --out output/input_manifest.json

      - name: Publish summaries to workflow page
        if: always()
        run: |
          if [ -f research/pbh_satellite_scan/output/LAGEOS_SUMMARY.md ]; then
            cat research/pbh_satellite_scan/output/LAGEOS_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f research/pbh_satellite_scan/output/SUMMARY.md ]; then
            cat research/pbh_satellite_scan/output/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbh-lageos-scan
          path: research/pbh_satellite_scan/output/
          if-no-files-found: warn
          retention-days: 30
