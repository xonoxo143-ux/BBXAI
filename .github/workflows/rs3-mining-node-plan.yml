name: RS3 Mining Node Plan

on:
  push:
    branches:
      - rs3-wiki-skill-image-runner
    paths:
      - "tools/rs3_reference/reference_mining_nodes.py"
      - ".github/workflows/rs3-mining-node-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Resolve Mining world nodes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve nodes
        run: python tools/rs3_reference/reference_mining_nodes.py
      - name: Add summary
        if: always()
        run: |
          if [[ -f rs3_mining_node_plan/SUMMARY.md ]]; then cat rs3_mining_node_plan/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: rs3-mining-node-plan
          path: rs3_mining_node_plan/
          if-no-files-found: error
          retention-days: 7
