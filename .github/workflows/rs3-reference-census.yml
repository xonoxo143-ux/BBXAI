name: RS3 Reference Census

on:
  push:
    branches:
      - rs3-wiki-skill-image-runner
    paths:
      - "tools/rs3_reference/reference_census.py"
      - ".github/workflows/rs3-reference-census.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    name: Census canonical skilling references
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build metadata census
        run: python tools/rs3_reference/reference_census.py

      - name: Add summary
        if: always()
        run: |
          if [[ -f rs3_reference_census/SUMMARY.md ]]; then
            cat rs3_reference_census/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload census
        uses: actions/upload-artifact@v4
        with:
          name: rs3-reference-census
          path: rs3_reference_census/
          if-no-files-found: error
          retention-days: 7
