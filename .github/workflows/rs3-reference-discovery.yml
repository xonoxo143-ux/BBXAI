name: RS3 Reference Discovery

on:
  push:
    branches:
      - rs3-wiki-skill-image-runner
    paths:
      - "tools/rs3_reference/reference_discovery.py"
      - ".github/workflows/rs3-reference-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover structured RS3 reference sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe Wiki schemas and image taxonomy
        run: python tools/rs3_reference/reference_discovery.py

      - name: Add summary
        if: always()
        run: |
          if [[ -f rs3_reference_discovery/SUMMARY.md ]]; then
            cat rs3_reference_discovery/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: rs3-reference-discovery
          path: rs3_reference_discovery/
          if-no-files-found: error
          retention-days: 7
