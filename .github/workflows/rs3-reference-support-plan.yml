name: RS3 Support Reference Plan

on:
  push:
    branches:
      - rs3-wiki-skill-image-runner
    paths:
      - "tools/rs3_reference/reference_support_plan.py"
      - ".github/workflows/rs3-reference-support-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support:
    name: Resolve tools facilities and mining nodes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build support reference plan
        run: python tools/rs3_reference/reference_support_plan.py

      - name: Add summary
        if: always()
        run: |
          if [[ -f rs3_reference_support_plan/SUMMARY.md ]]; then
            cat rs3_reference_support_plan/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload support plan
        uses: actions/upload-artifact@v4
        with:
          name: rs3-reference-support-plan
          path: rs3_reference_support_plan/
          if-no-files-found: error
          retention-days: 7
