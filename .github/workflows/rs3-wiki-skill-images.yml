name: RS3 Wiki Skill Images

on:
  push:
    branches:
      - rs3-wiki-skill-image-runner
    paths:
      - "tools/rs3_wiki_scraper/**"
      - ".github/workflows/rs3-wiki-skill-images.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collect selected skills or every skill"
        required: true
        default: "skills"
        type: choice
        options:
          - skills
          - all
      skills:
        description: "Space-separated skills when mode=skills"
        required: true
        default: "Woodcutting"
        type: string
      depth:
        description: "Category recursion depth"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      keep_ui:
        description: "Keep obvious icons/UI images"
        required: true
        default: false
        type: boolean
      tree_only:
        description: "For Woodcutting, keep one canonical render per tree resource page"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  collect:
    name: Collect wiki images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'skills' }}
      SKILLS: ${{ github.event_name == 'workflow_dispatch' && inputs.skills || 'Woodcutting' }}
      DEPTH: ${{ github.event_name == 'workflow_dispatch' && inputs.depth || '3' }}
      KEEP_UI: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_ui || false }}
      TREE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.tree_only || true }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rs3_wiki_scraper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/rs3_wiki_scraper/requirements.txt

      - name: Collect RuneScape Wiki images
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$MODE" == "all" ]]; then
            ARGS=(--all-skills)
          else
            read -r -a SKILL_ARRAY <<< "$SKILLS"
            ARGS=(--skills "${SKILL_ARRAY[@]}")
          fi

          if [[ "$KEEP_UI" == "true" ]]; then
            ARGS+=(--keep-ui)
          fi

          if [[ "$TREE_ONLY" == "true" ]]; then
            ARGS+=(--tree-only)
          fi

          python tools/rs3_wiki_scraper/rs3_wiki_skill_images.py \
            "${ARGS[@]}" \
            --depth "$DEPTH" \
            --out rs3_wiki_skill_images

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [[ -f rs3_wiki_skill_images/_run_info.json ]]; then
            echo "## RS3 Wiki image collection" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat rs3_wiki_skill_images/_run_info.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload image archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rs3-wiki-skill-images
          path: rs3_wiki_skill_images.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
