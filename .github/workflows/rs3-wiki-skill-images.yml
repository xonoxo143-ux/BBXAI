name: RS3 Wiki Asset Pairs

on:
  push:
    branches:
      - rs3-wiki-skill-image-runner
    paths:
      - "tools/rs3_wiki_scraper/**"
      - ".github/workflows/rs3-wiki-skill-images.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Asset-pair profile"
        required: true
        default: "woodcutting"
        type: choice
        options:
          - woodcutting

permissions:
  contents: read

jobs:
  collect:
    name: Collect paired wiki assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'woodcutting' }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/rs3_wiki_scraper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/rs3_wiki_scraper/requirements.txt

      - name: Collect paired RuneScape Wiki assets
        run: |
          python tools/rs3_wiki_scraper/rs3_wiki_pairs_v2.py \
            --profile "$PROFILE" \
            --out rs3_wiki_pairs

      - name: Write run summary
        if: always()
        run: |
          if [[ -f rs3_wiki_pairs/_run_info.json ]]; then
            echo "## RS3 Wiki paired asset collection" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat rs3_wiki_pairs/_run_info.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f rs3_wiki_pairs/_pairs.csv ]]; then
            echo "### Matched pairs" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            head -n 100 rs3_wiki_pairs/_pairs.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload paired reference archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rs3-wiki-paired-assets
          path: rs3_wiki_pairs.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
