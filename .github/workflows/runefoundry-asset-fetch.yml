name: RuneFoundry Asset Fetch

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/runefoundry-asset-runner
    paths:
      - .github/workflows/runefoundry-asset-fetch.yml

permissions:
  contents: read

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch official free Modular Character Outfits Fantasy pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asset-fetch/downloads asset-fetch/diagnostics
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2 >/dev/null

          cat > fetch-quaternius.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const executable = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : undefined;
          const browser = await chromium.launch({headless:true, executablePath:executable, args:['--no-sandbox']});
          const context = await browser.newContext({acceptDownloads:true});
          const page = await context.newPage();
          page.setDefaultTimeout(30000);
          const purchase = 'https://quaternius.itch.io/modular-character-outfits-fantasy/purchase';
          const targetName = 'Modular Character Outfits - Fantasy[Standard].zip';
          await page.goto(purchase, {waitUntil:'domcontentloaded', timeout:60000});
          fs.writeFileSync('asset-fetch/diagnostics/purchase.html', await page.content());
          const free = page.getByText('No thanks, just take me to the downloads', {exact:false}).first();
          if (await free.count() === 0) throw new Error('itch free-download link not found');
          await free.click();
          await page.waitForTimeout(3000);
          fs.writeFileSync('asset-fetch/diagnostics/downloads.html', await page.content());
          await page.screenshot({path:'asset-fetch/diagnostics/downloads.png', fullPage:true});
          let row = page.locator('.upload').filter({hasText:targetName}).first();
          if (await row.count() === 0) row = page.locator('div').filter({hasText:targetName}).first();
          if (await row.count() === 0) throw new Error('Standard outfit ZIP row not found');
          let button = row.getByRole('button', {name:/download/i}).first();
          if (await button.count() === 0) button = row.getByRole('link', {name:/download/i}).first();
          if (await button.count() === 0) button = row.locator('a,button').filter({hasText:/download/i}).first();
          const downloadPromise = page.waitForEvent('download', {timeout:180000});
          await button.click();
          const download = await downloadPromise;
          await download.saveAs('asset-fetch/downloads/Fantasy_Outfits_Standard.zip');
          await browser.close();
          JS
          node ./fetch-quaternius.mjs

      - name: Extract and select Godot/glTF donor files
        shell: bash
        run: |
          set -euo pipefail
          unzip -t asset-fetch/downloads/Fantasy_Outfits_Standard.zip >/dev/null
          mkdir -p asset-fetch/extracted asset-fetch/selected
          unzip -q asset-fetch/downloads/Fantasy_Outfits_Standard.zip -d asset-fetch/extracted
          unzip -l asset-fetch/downloads/Fantasy_Outfits_Standard.zip > asset-fetch/ZIP_INVENTORY.txt
          find asset-fetch/extracted -type f -printf '%p\n' | sort > asset-fetch/EXTRACTED_FILES.txt
          echo '--- likely GLTF/Godot files ---'
          grep -Ei '(gltf|godot|license|texture)' asset-fetch/EXTRACTED_FILES.txt | head -500 || true

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('asset-fetch/extracted')
          dst=Path('asset-fetch/selected')
          chosen=[]
          for p in src.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(src)
              low=str(rel).lower()
              suffix=p.suffix.lower()
              keep=False
              if 'license' in p.name.lower() and suffix in {'.txt','.md'}: keep=True
              if suffix in {'.gltf','.bin','.png','.jpg','.jpeg'} and ('godot' in low or 'gltf' in low): keep=True
              # Shared texture folders are sometimes siblings of the glTF export folders.
              if suffix in {'.png','.jpg','.jpeg'} and 'texture' in low: keep=True
              if keep:
                  out=dst/rel
                  out.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,out)
                  chosen.append(str(rel))
          Path('asset-fetch/SELECTED_FILES.txt').write_text('\n'.join(sorted(chosen)))
          print('selected',len(chosen),'files')
          PY
          sha256sum asset-fetch/downloads/Fantasy_Outfits_Standard.zip > asset-fetch/SHA256SUMS.txt
          du -sh asset-fetch/selected
          # Keep the runner artifact focused on reusable Godot files, not duplicate FBX/Unity exports.
          rm -rf asset-fetch/extracted asset-fetch/downloads

      - name: Upload selected outfit donor bundle
        uses: actions/upload-artifact@v4
        with:
          name: runefoundry-quaternius-official-fantasy-outfits
          path: asset-fetch/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
