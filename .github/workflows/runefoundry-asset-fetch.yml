name: RuneFoundry Asset Fetch

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/runefoundry-asset-runner
    paths:
      - .github/workflows/runefoundry-asset-fetch.yml

permissions:
  contents: read

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch official free Universal Base Characters pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asset-fetch/downloads asset-fetch/diagnostics
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2 >/dev/null

          cat > /tmp/fetch.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const executable = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : undefined;
          const browser = await chromium.launch({headless:true, executablePath:executable, args:['--no-sandbox']});
          const context = await browser.newContext({acceptDownloads:true});
          const page = await context.newPage();
          page.setDefaultTimeout(30000);

          const purchase = 'https://quaternius.itch.io/universal-base-characters/purchase';
          console.log('opening', purchase);
          await page.goto(purchase, {waitUntil:'domcontentloaded', timeout:60000});
          fs.writeFileSync('asset-fetch/diagnostics/purchase.html', await page.content());
          await page.screenshot({path:'asset-fetch/diagnostics/purchase.png', fullPage:true});

          const free = page.getByText('No thanks, just take me to the downloads', {exact:false}).first();
          if (await free.count() === 0) throw new Error('itch free-download link not found');
          console.log('clicking free download route');
          await Promise.all([
            page.waitForLoadState('domcontentloaded').catch(()=>{}),
            free.click()
          ]);
          await page.waitForTimeout(2500);
          console.log('download page', page.url());
          fs.writeFileSync('asset-fetch/diagnostics/downloads.html', await page.content());
          await page.screenshot({path:'asset-fetch/diagnostics/downloads.png', fullPage:true});

          const targetName = 'Universal Base Characters[Standard].zip';
          let row = page.locator('.upload').filter({hasText:targetName}).first();
          if (await row.count() === 0) row = page.locator('div').filter({hasText:targetName}).first();
          if (await row.count() === 0) throw new Error('Standard ZIP row not found');
          console.log('row text:', (await row.innerText()).slice(0,500));

          let button = row.getByRole('button', {name:/download/i}).first();
          if (await button.count() === 0) button = row.getByRole('link', {name:/download/i}).first();
          if (await button.count() === 0) button = row.locator('a,button').filter({hasText:/download/i}).first();
          if (await button.count() === 0) throw new Error('Download control not found for Standard ZIP');

          console.log('starting Standard ZIP download');
          const downloadPromise = page.waitForEvent('download', {timeout:120000});
          await button.click();
          const download = await downloadPromise;
          console.log('suggested filename', download.suggestedFilename());
          await download.saveAs('asset-fetch/downloads/Universal_Base_Characters_Standard.zip');
          await browser.close();
          JS

          node /tmp/fetch.mjs

      - name: Verify and inventory official pack
        shell: bash
        run: |
          set -euo pipefail
          unzip -t asset-fetch/downloads/Universal_Base_Characters_Standard.zip >/dev/null
          unzip -l asset-fetch/downloads/Universal_Base_Characters_Standard.zip > asset-fetch/ZIP_INVENTORY.txt
          ls -lh asset-fetch/downloads/Universal_Base_Characters_Standard.zip
          grep -Ei '\.(glb|gltf|fbx|blend|png|jpg|jpeg)$' asset-fetch/ZIP_INVENTORY.txt | head -250 || true
          sha256sum asset-fetch/downloads/Universal_Base_Characters_Standard.zip > asset-fetch/SHA256SUMS.txt

      - name: Extract Godot-friendly body candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asset-fetch/extracted
          unzip -q asset-fetch/downloads/Universal_Base_Characters_Standard.zip -d asset-fetch/extracted
          find asset-fetch/extracted -type f -printf '%p\n' | grep -Ei '\.(glb|gltf|fbx|png|jpg|jpeg|txt)$' | sort > asset-fetch/EXTRACTED_FILES.txt
          cat asset-fetch/EXTRACTED_FILES.txt | head -300

      - name: Upload official pack and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: runefoundry-quaternius-official-base-characters
          path: asset-fetch/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
