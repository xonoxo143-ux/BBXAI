name: RuneFoundry Asset Fetch

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/runefoundry-asset-runner
    paths:
      - .github/workflows/runefoundry-asset-fetch.yml

permissions:
  contents: read

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Fetch official free Modular Character Outfits Fantasy pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asset-fetch/downloads asset-fetch/diagnostics
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.2 >/dev/null

          cat > fetch-quaternius.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const executable = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : undefined;
          const browser = await chromium.launch({headless:true, executablePath:executable, args:['--no-sandbox']});
          const purchase = 'https://quaternius.itch.io/modular-character-outfits-fantasy/purchase';
          const targetName = 'Modular Character Outfits - Fantasy[Standard].zip';
          let success = false;
          let lastError = '';

          for (let attempt=1; attempt<=5 && !success; attempt++) {
            const context = await browser.newContext({acceptDownloads:true});
            const page = await context.newPage();
            page.setDefaultTimeout(35000);
            try {
              console.log(`attempt ${attempt}: opening ${purchase}`);
              const resp = await page.goto(purchase, {waitUntil:'domcontentloaded', timeout:60000});
              console.log('status', resp?.status(), 'url', page.url(), 'title', await page.title());
              await page.waitForTimeout(1500 + attempt*1000);
              fs.writeFileSync(`asset-fetch/diagnostics/purchase-${attempt}.html`, await page.content());
              await page.screenshot({path:`asset-fetch/diagnostics/purchase-${attempt}.png`, fullPage:true});

              let free = page.locator('a.direct_download_btn').first();
              if (await free.count() === 0) free = page.getByText('No thanks, just take me to the downloads', {exact:false}).first();
              if (await free.count() === 0) {
                const body = (await page.locator('body').innerText().catch(()=>'' )).slice(0,1500);
                console.log('free control missing; body preview:', body);
                throw new Error('free-download control missing');
              }

              await free.click();
              await page.waitForTimeout(3000);
              console.log('download page', page.url(), 'title', await page.title());
              fs.writeFileSync(`asset-fetch/diagnostics/downloads-${attempt}.html`, await page.content());
              await page.screenshot({path:`asset-fetch/diagnostics/downloads-${attempt}.png`, fullPage:true});

              let row = page.locator('.upload').filter({hasText:targetName}).first();
              if (await row.count() === 0) row = page.locator('.upload').filter({hasText:'Standard'}).first();
              if (await row.count() === 0) throw new Error('Standard outfit ZIP row missing');
              console.log('row:', (await row.innerText()).slice(0,500));

              let button = row.locator('a.download_btn').first();
              if (await button.count() === 0) button = row.getByText('Download', {exact:true}).first();
              if (await button.count() === 0) throw new Error('download button missing');

              const downloadPromise = page.waitForEvent('download', {timeout:180000});
              await button.click();
              const download = await downloadPromise;
              console.log('suggested filename', download.suggestedFilename());
              await download.saveAs('asset-fetch/downloads/Fantasy_Outfits_Standard.zip');
              success = true;
            } catch (e) {
              lastError = String(e?.stack || e);
              console.log('attempt failed:', lastError);
              await new Promise(r=>setTimeout(r, attempt*2500));
            } finally {
              await context.close();
            }
          }

          await browser.close();
          if (!success) throw new Error(`all itch download attempts failed: ${lastError}`);
          JS
          node ./fetch-quaternius.mjs

      - name: Extract and select glTF donor files
        shell: bash
        run: |
          set -euo pipefail
          unzip -t asset-fetch/downloads/Fantasy_Outfits_Standard.zip >/dev/null
          mkdir -p asset-fetch/extracted asset-fetch/selected
          unzip -q asset-fetch/downloads/Fantasy_Outfits_Standard.zip -d asset-fetch/extracted
          unzip -l asset-fetch/downloads/Fantasy_Outfits_Standard.zip > asset-fetch/ZIP_INVENTORY.txt
          find asset-fetch/extracted -type f -printf '%p\n' | sort > asset-fetch/EXTRACTED_FILES.txt

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('asset-fetch/extracted')
          dst=Path('asset-fetch/selected')
          chosen=[]
          for p in src.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(src)
              low=str(rel).lower()
              suffix=p.suffix.lower()
              keep=False
              if 'license' in p.name.lower() and suffix in {'.txt','.md'}: keep=True
              if suffix in {'.gltf','.bin'}: keep=True
              if suffix in {'.png','.jpg','.jpeg'} and ('texture' in low or 'gltf' in low or 'godot' in low): keep=True
              if keep:
                  out=dst/rel
                  out.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(p,out)
                  chosen.append(str(rel))
          Path('asset-fetch/SELECTED_FILES.txt').write_text('\n'.join(sorted(chosen)))
          print('selected',len(chosen),'files')
          PY

          sha256sum asset-fetch/downloads/Fantasy_Outfits_Standard.zip > asset-fetch/SHA256SUMS.txt
          du -sh asset-fetch/selected
          rm -rf asset-fetch/extracted asset-fetch/downloads

      - name: Upload selected outfit donor bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runefoundry-quaternius-official-fantasy-outfits
          path: asset-fetch/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
